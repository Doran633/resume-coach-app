# Place limit zones inside the nginx http {} block.
map $request_method $resume_generation_submit_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $resume_generation_submit_key zone=resume_generate_ip:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=resume_api_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=resume_events_ip:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=resume_files_ip:10m rate=30r/s;

server {
    listen 80;
    server_name resume.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name resume.example.com;

    # Configure real certificate paths on the server.
    ssl_certificate /etc/letsencrypt/live/resume.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resume.example.com/privkey.pem;

    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    root /www/wwwroot/resume-coach-app/frontend/dist;
    index index.html;

    location /api/generation-attempts {
        limit_req zone=resume_generate_ip burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 95s;
        proxy_send_timeout 95s;
    }

    # Compatibility endpoint: keep the same submit protection during migration.
    location = /api/generate {
        limit_req zone=resume_generate_ip burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 170s;
        proxy_send_timeout 170s;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
    }

    location ^~ /api/health/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
    }

    location = /api/events {
        limit_req zone=resume_events_ip burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/files/ {
        limit_req zone=resume_files_ip burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=resume_api_ip burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 95s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /backend/logs/ { deny all; }
    location ^~ /backend/data/ { deny all; }
    location ^~ /backend/outputs/ { deny all; }
}

# When a CDN is enabled, add only that provider's documented egress ranges:
# set_real_ip_from 192.0.2.0/24;
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;
